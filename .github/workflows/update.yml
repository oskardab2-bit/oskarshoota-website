name: Referenzen aktualisieren
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/**]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build.py
      - name: Änderungen committen
        run: |
          git config user.name "oskarshoota-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public
          git diff --cached --quiet || (git commit -m "Referenzen aus Spotify-Playlist aktualisiert" && git push)
